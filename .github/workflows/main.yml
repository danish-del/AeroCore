
name: ASP.NET Core CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore AeroCore.slnx

      - name: Build
        run: dotnet build AeroCore.slnx --no-restore

      - name: Test
        run: dotnet test AeroCore.slnx --no-build

      - name: Build Docker image
        run: docker build -t aerocore-api:ci .
